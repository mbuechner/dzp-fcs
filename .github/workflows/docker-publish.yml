name: Docker

on:
  release:
    types: [published]
  schedule:
    - cron: '17 8 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag (empty selects the maintained release)
        type: string
        default: ''

permissions: {}

jobs:
  dispatch-release:
    name: Queue the published release on the default branch
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # Release events run at the Git tag, so only dispatch from this job.
      - name: Dispatch publisher on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            --raw-field "release_tag=$RELEASE_TAG"

  publish:
    name: Check and publish the release image to GHCR
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    concurrency:
      group: docker-publish
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PLATFORM: linux/amd64
    steps:
      - name: Check out publisher scripts and actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select a published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE: ${{ inputs.release_tag }}
          MAINTAINED_RELEASE: ${{ vars.CONTAINER_RELEASE_TAG }}
        shell: bash
        run: |
          valid_tag() {
            [[ "$1" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ && "$1" != latest && "$1" != tagged ]]
          }

          requested="${REQUESTED_RELEASE:-$MAINTAINED_RELEASE}"
          endpoint="repos/$GITHUB_REPOSITORY/releases/latest"
          if [[ -n "$requested" ]]; then
            if ! valid_tag "$requested"; then
              echo '::error::Choose a release tag usable as a container version tag, such as v1.5.1.'
              exit 1
            fi
            endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$requested"
          fi

          tag="$(gh api "$endpoint" --jq 'select(.published_at and (.draft | not) and (.prerelease | not)) | .tag_name')"
          if ! valid_tag "$tag"; then
            echo '::error::Choose a published stable GitHub release with a valid container version tag.'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the release source and Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Record release commit and reproducible timestamps
        id: source
        shell: bash
        run: |
          epoch="$(git -C release-source show -s --format=%ct HEAD)"
          created="$(date -u -d "@$epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          revision="$(git -C release-source rev-parse HEAD)"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "epoch=$epoch"
            echo "created=$created"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compare the release commit and base image digests
        id: bases
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
        run: python3 .github/scripts/container-build-inputs.py

      - name: Build and stage the image by digest
        id: image
        if: steps.bases.outputs.reusable_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release-source
          build-contexts: ${{ steps.bases.outputs.contexts }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          platforms: ${{ env.PLATFORM }}
          pull: true
          labels: |
            org.opencontainers.image.title=German Newspaper Portal FCS
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.base.name=${{ steps.bases.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.bases.outputs.base_digest }}
            de.ddb.labs.dzp-fcs.build-inputs=${{ steps.bases.outputs.fingerprint }}
          provenance: false
          outputs: type=image,name=${{ steps.source.outputs.image }},push=true,push-by-digest=true,name-canonical=true,rewrite-timestamp=true
          cache-from: type=gha,scope=dzp-fcs
          cache-to: type=gha,scope=dzp-fcs,mode=max

      - name: Test and scan the release digest
        uses: ./.github/actions/check-container
        with:
          image: ${{ steps.source.outputs.image }}@${{ steps.image.outputs.digest || steps.bases.outputs.reusable_digest }}
          container-port: '8080'
          http-path: ${{ vars.CONTAINER_HTTP_PATH || '/?operation=explain' }}
          cyclonedx-path: /usr/local/tomcat/dzp-fcs/dzp-fcs-sbom.json
          block-on-fixable: 'true'

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the checked digest and update release tags
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest || steps.bases.outputs.reusable_digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          MAINTAINED_RELEASE: ${{ vars.CONTAINER_RELEASE_TAG }}
        shell: bash
        run: |
          current_source="$(gh api "repos/$GITHUB_REPOSITORY/commits/tags%2F$RELEASE_TAG" --jq '.sha')"
          if [[ "$current_source" != "$RELEASE_REVISION" ]]; then
            echo '::error::The Git tag changed during the checks.'
            exit 1
          fi
          published_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'select(.published_at and (.draft | not) and (.prerelease | not)) | .tag_name')"
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo '::error::The GitHub release is no longer published and stable.'
            exit 1
          fi

          # Resolve the maintained release again in case a newer release was published during the checks.
          maintained="${MAINTAINED_RELEASE:-$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')}"
          tags=("$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == "$maintained" ]]; then
            tags+=(latest tagged)
          fi

          promotion=()
          needs_promotion=false
          for tag in "${tags[@]}"; do
            target="$IMAGE:$tag"
            promotion+=(--tag "$target")
            if ! current="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$target" 2>&1)"; then
              if [[ "${current,,}" == *"${target,,}: not found"* || "${current,,}" == *'manifest unknown'* ]]; then
                current=''
              else
                printf '%s\n' "$current" >&2
                exit 1
              fi
            fi
            if [[ "$current" != "$DIGEST" ]]; then
              needs_promotion=true
            fi
          done

          if [[ "$needs_promotion" == true ]]; then
            cosign sign --yes "$IMAGE@$DIGEST"
            docker buildx imagetools create --prefer-index=false "${promotion[@]}" "$IMAGE@$DIGEST"
            printf 'Published `%s` for `%s`.\n' "$IMAGE@$DIGEST" "${tags[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Checked `%s`. The release tags already reference this digest.\n' "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          fi
